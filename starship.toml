# Starship — clean minimal prompt, Catppuccin Mocha.
#   user@host  /full/path  on git-branch  ⇡ status
#   ❯
#
# Install:  cp starship.toml ~/.config/starship.toml
# Requires: eval "$(starship init zsh)"  in ~/.zshrc

"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"
add_newline = true

format = """
$username[@](bold green)$hostname $directory$git_branch$git_status$cmd_duration
$character"""

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold green"
format = "[$hostname]($style)"

[directory]
style = "bold blue"
truncation_length = 0          # show the full path, like the screenshot
truncate_to_repo = false
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "mauve"
format = "[on ](fg:overlay1)[$symbol$branch]($style) "

[git_status]
style = "peach"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2000
style = "fg:overlay1"
format = "[took $duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[palettes.catppuccin_mocha]
red       = "#f38ba8"
peach     = "#fab387"
green     = "#a6e3a1"
teal      = "#94e2d5"
blue      = "#89b4fa"
mauve     = "#cba6f7"
lavender  = "#b4befe"
text      = "#cdd6f4"
overlay1  = "#7f849c"
base      = "#1e1e2e"
